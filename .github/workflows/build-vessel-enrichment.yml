name: Build vessel enrichment

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  push:
    paths:
      - "data/vessels.csv"
      - "data/vessels/**"
      - "tools/build_vessel_enrichment.py"
      - ".github/workflows/build-vessel-enrichment.yml"

permissions:
  contents: write

concurrency:
  group: vessel-enrichment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Interne Tests
        run: python tools/build_vessel_enrichment.py --self-test

      - name: Anreicherungsreport erstellen
        env:
          WIKIDATA_USER_AGENT: >-
            DanubeVesselLog/0.13.7
            (https://github.com/${{ github.repository }}; vessel enrichment)
          WIKIDATA_DELAY_SECONDS: "0.75"
          WIKIDATA_MAX_CANDIDATES: "5"
          WIKIDATA_WDQS_RETRIES: "1"
        run: python tools/build_vessel_enrichment.py

      - name: Report einchecken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/vessel_enrichment.json
          if git diff --cached --quiet; then
            echo "Keine Änderung am Anreicherungsreport."
          else
            git commit -m "Anreicherungsreport aktualisiert"
            for ATTEMPT in 1 2 3 4 5
            do
              echo "Push-Versuch $ATTEMPT von 5"
            
              git fetch origin main
            
              if ! git rebase origin/main
              then
                echo "Der lokale Report-Commit konnte nicht auf den aktuellen main-Stand gesetzt werden."
                git rebase --abort || true
                exit 1
              fi
            
              if git push origin HEAD:main
              then
                echo "Push erfolgreich."
                exit 0
              fi
            
              echo "main wurde erneut verändert; neuer Versuch folgt."
              sleep $((ATTEMPT * 2))
            done
            
            echo "Push war nach fünf Versuchen weiterhin nicht möglich."
            exit 1
          fi
