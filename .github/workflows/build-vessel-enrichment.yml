# Danube Vessel Log
# File: .github/workflows/build-vessel-enrichment.yml
# Version: 0.15.7
# Updated: 2026-08-26

name: Build vessel enrichment

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches:
      - main
    paths:
      - "data/vessels.csv"
      - "data/vessels/**.json"
      - "tools/build_vessel_enrichment.py"
      - "tools/check_vessel_enrichment_relevance.py"
      - ".github/workflows/build-vessel-enrichment.yml"

permissions:
  contents: write

concurrency:
  group: vessel-enrichment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Relevanz der Änderung prüfen
        id: relevance
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          RELEVANT=$(python tools/check_vessel_enrichment_relevance.py \
            "${{ github.event.before }}" \
            "${{ github.sha }}")
          echo "relevant=$RELEVANT" >> "$GITHUB_OUTPUT"
          if [ "$RELEVANT" = "true" ]; then
            echo "Stammdatenänderung: Anreicherungsreport wird neu gebaut."
          else
            echo "Nur Media/Audit bzw. andere nicht relevante Schiffsdaten geändert."
            echo "Wikidata-Neuaufbau wird übersprungen."
          fi

      - name: Python einrichten
        if: github.event_name != 'push' || steps.relevance.outputs.relevant == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Report auf aktuellem main erstellen und einchecken
        if: github.event_name != 'push' || steps.relevance.outputs.relevant == 'true'
        env:
          WIKIDATA_USER_AGENT: >-
            DanubeVesselLog/0.14.15
            (https://github.com/${{ github.repository }}; vessel enrichment)
          WIKIDATA_DELAY_SECONDS: "0.75"
          WIKIDATA_MAX_CANDIDATES: "5"
          WIKIDATA_WDQS_RETRIES: "1"
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for ATTEMPT in 1 2 3 4 5
          do
            echo "Versuch $ATTEMPT von 5"

            # Nicht den bereits erzeugten Report auf einen neuen main-Stand
            # rebasen. Stattdessen stets vom aktuellen main ausgehen und den
            # abgeleiteten Report vollständig neu erzeugen.
            git fetch origin main
            git reset --hard origin/main

            python tools/build_vessel_enrichment.py --self-test
            python tools/build_vessel_enrichment.py

            git add docs/data/vessel_enrichment.json

            if git diff --cached --quiet
            then
              echo "Keine Änderung am Anreicherungsreport."
              exit 0
            fi

            git commit -m "Anreicherungsreport aktualisiert"

            if git push origin HEAD:main
            then
              echo "Push erfolgreich."
              exit 0
            fi

            echo "main wurde während des Laufs erneut verändert."
            echo "Der Report wird auf Basis des neuen main-Stands nochmals erzeugt."
            sleep $((ATTEMPT * 2))
          done

          echo "Push war nach fünf vollständigen Neuaufbauten weiterhin nicht möglich."
          exit 1
