<!DOCTYPE html>
<!--
  Danube Vessel Log
  File: docs/vessels.html
  Version: 0.15.2
  Updated: 2026-08-24
-->
<html lang="de">
<head>
  <meta charset="UTF-8">
  <!-- Danube Vessel Log: Favicons -->
  <link rel="icon" href="assets/favicon/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon/favicon-48x48.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
  <link rel="manifest" href="assets/favicon/site.webmanifest">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schiffe</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/vessels.css">
</head>
<body>
  <div class="site-nav-shell" data-site-nav></div>

  <main class="vessels-page">
    <header class="vessels-header">
      <div>
        <h1>Schiffe</h1>
        <p>Kanonische Schiffsstammdaten durchsuchen und öffnen.</p>
      </div>
      <button id="reloadButton" class="secondary-button" type="button">Neu laden</button>
    </header>

    <section class="connection-card" data-api-key-settings>
      <div class="form-field compact-field">
        <label for="apiKey">Management-API-Schlüssel</label>
        <input id="apiKey" type="password" placeholder="Optional" autocomplete="off">
      </div>
    </section>

    <section class="filter-card" aria-label="Filter">
      <div class="form-field search-field">
        <label for="searchInput">Suche</label>
        <input id="searchInput" type="search" placeholder="Name, frühere Namen, ID, MMSI, IMO, ENI …" autocomplete="off">
      </div>

      <div class="filter-grid">
        <div class="form-field filter-type-field">
          <label for="typeFilter">Schiffstyp</label>
          <select id="typeFilter"><option value="">Alle</option></select>
        </div>
        <div class="form-field filter-flag-field">
          <label for="flagFilter">Flagge</label>
          <select id="flagFilter"><option value="">Alle</option></select>
        </div>
        <div class="form-field filter-status-field">
          <label for="statusFilter">Status</label>
          <select id="statusFilter"><option value="">Alle</option></select>
        </div>
        <label class="test-toggle">
          <input id="showTestData" type="checkbox">
          <span>Testdaten anzeigen</span>
        </label>
      </div>
    </section>

    <div class="list-toolbar">
      <div id="resultCount" class="result-count" aria-live="polite"></div>
      <div id="listStatus" class="list-status" aria-live="polite"></div>
    </div>

    <section class="table-card">
      <div class="table-scroll">
        <table class="vessels-table">
          <thead>
            <tr>
              <th data-sort-key="vessel_id" aria-sort="ascending"><button class="table-sort-button" type="button">Vessel-ID <span class="sort-indicator" aria-hidden="true">↑</span></button></th>
              <th data-sort-key="name" aria-sort="none"><button class="table-sort-button" type="button">Name <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
              <th class="numeric-column" data-sort-key="sighting_count" aria-sort="none"><button class="table-sort-button" type="button">Sichtungen <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
              <th class="numeric-column" data-sort-key="photo_count" aria-sort="none"><button class="table-sort-button" type="button">Fotos <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
              <th data-sort-key="ship_type" aria-sort="none"><button class="table-sort-button" type="button">Typ <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
              <th data-sort-key="operator" aria-sort="none"><button class="table-sort-button" type="button">Betreiber <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
              <th data-sort-key="flag" aria-sort="none"><button class="table-sort-button" type="button">Flagge <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
              <th data-sort-key="year_built" aria-sort="none"><button class="table-sort-button" type="button">Baujahr <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
              <th data-sort-key="status" aria-sort="none"><button class="table-sort-button" type="button">Status <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
            </tr>
          </thead>
          <tbody id="vesselRows"></tbody>
        </table>
      </div>
      <div id="emptyState" class="empty-state hidden">Keine passenden Schiffe gefunden.</div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/site_map.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/api.js"></script>
  <script src="js/vessels.js"></script>
</body>
</html>
